<div class="controls-section">
  @if (generations.error(); as error) {
    <div class="error-message">{{ error.message }}</div>
  }
  @if (generationNames(); as names) {
    <label>
      Generation:
      <select>
        @for (name of names; track name) {
          <option>{{ name }}</option>
        }
      </select>
    </label>
  }
  <button (click)="generations.reload()">Reload generations</button>
</div>
